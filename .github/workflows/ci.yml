name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Non-blocking on purpose. There are currently 8 high/critical advisories
      # that can only be cleared by upgrading `next` (needs >= 16.3.5) and
      # `next-auth`; both upgrades are deliberately out of scope for the
      # quality-gate change and are tracked separately.
      # TODO: drop `continue-on-error` once next and next-auth are upgraded,
      # so a new high-severity advisory blocks the build.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
